
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu Friendly Fire Stats</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background-color: #0056b3; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    .stat-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #007bff;
    }
    .stat-label { font-size: 0.85em; color: #6c757d; }
    .stat-value { font-size: 1.3em; font-weight: bold; color: #212529; }
    .alias-badge {
      display: inline-block;
      background: #e9ecef;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      margin: 2px;
    }
  </style>
</head>
<body>

  <h2>Tra Cứu Friendly Fire Stats</h2>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Nhập tên nhân vật (vd: KeroN, Diana, Bảo Nguyên...)" onkeyup="if(event.key==='Enter') searchPlayer()">
    <button onclick="searchPlayer()">Tìm kiếm</button>
  </div>

  <div id="result"></div>

  <script>
    let mappings = {};
    let ffStats = {};

    // Tải dữ liệu khi trang được load
    Promise.all([
      fetch('mappings.json').then(res => res.json()),
      fetch('data/ff_stats_current.json').then(res => res.json())
    ]).then(([mapData, statsData]) => {
      mappings = mapData;
      ffStats = statsData;
    }).catch(err => {
      console.error('Lỗi tải dữ liệu:', err);
    });

    function searchPlayer() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';

      if (!query) {
        resultDiv.innerHTML = '<p>Vui lòng nhập tên cần tìm.</p>';
        return;
      }

      // Tìm ID tương ứng với tên nhập vào (chấp nhận tìm kiếm một phần tên)
      let matchedId = null;
      let matchedInputName = '';

      for (const [name, id] of Object.entries(mappings)) {
        if (name.toLowerCase().includes(query)) {
          matchedId = id;
          matchedInputName = name;
          break;
        }
      }

      if (!matchedId) {
        resultDiv.innerHTML = '<div class="card"><p>Không tìm thấy nhân vật này trong hệ thống mappings.</p></div>';
        return;
      }

      // Lấy tất cả các tên khác cùng thuộc ID này
      const allAliases = Object.keys(mappings).filter(name => mappings[name] === matchedId);
      const playerData = ffStats.players ? ffStats.players[matchedId] : null;

      if (!playerData) {
        resultDiv.innerHTML = `
          <div class="card">
            <h3>${matchedInputName}</h3>
            <p>ID: <code>${matchedId}</code></p>
            <p><i>Chưa có dữ liệu thống kê FF tuần này (${ffStats.meta?.week || ''}).</i></p>
          </div>
        `;
        return;
      }

      // Hiển thị kết quả
      resultDiv.innerHTML = `
        <div class="card">
          <h3>${matchedInputName}</h3>
          <p><small><b>ID:</b> ${matchedId}</small></p>
          <p><small><b>Các tên cùng ID:</b> ${allAliases.map(a => `<span class="alias-badge">${a}</span>`).join('')}</small></p>
          <hr>
          <p>Tuần thống kê: <b>${ffStats.meta?.week || 'N/A'}</b></p>
          
          <div class="stat-grid">
            <div class="stat-item">
              <div class="stat-label">Dame gây ra (Shot)</div>
              <div class="stat-value" style="color: #d9534f;">${playerData.shot}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Dame bị nhận (Shotted)</div>
              <div class="stat-value" style="color: #f0ad4e;">${playerData.shotted}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Số người bị giết (Kills)</div>
              <div class="stat-value">${playerData.kills_dealt}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Số người bị bắn Incap</div>
              <div class="stat-value">${playerData.incaps_dealt}</div>
            </div>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
